document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\nhtml,body{margin:0;height:100%}\nbody{font-family:'Mona Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;background:#FCFCFD;color:#17171A}\na{color:var(--accent-text);text-decoration:none}\na:hover{text-decoration:underline;text-decoration-color:var(--accent-underline);text-underline-offset:3px}\nbutton,input,select,textarea{font:inherit;color:inherit}\ninput::placeholder,textarea::placeholder{color:var(--tx-3)}\n:focus-visible{outline:2px solid var(--focus);outline-offset:2px}\n@keyframes qpulse{0%,100%{opacity:.45}50%{opacity:1}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-theme=\"{{ themeAttr }}\" style=\"position:fixed;inset:0;display:flex;background:var(--bg-content);color:var(--tx-1);font-family:var(--font-sans)\">\n\n<sc-if value=\"{{ loading }}\"><div style=\"margin:auto;font-size:13px;color:var(--tx-2)\">Loading…<\u002Fdiv><\u002Fsc-if>\n\n<!-- SIGN IN -->\n<sc-if value=\"{{ signedOut }}\">\n  <div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg-canvas);padding:40px\">\n    <form sc-camel-on-submit=\"{{ auth.submit }}\" style=\"width:380px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><span role=\"img\" aria-label=\"Quoly\" style=\"width:26px;height:26px;background:var(--logo, url(&quot;44829117-3c38-4aef-a119-32a0af6131c0&quot;)) center / contain no-repeat\"><\u002Fspan><span style=\"font-size:19px;font-weight:600;letter-spacing:-0.01em\">Quoly<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><h1 style=\"margin:0;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-0.02em\">{{ auth.title }}<\u002Fh1><p style=\"margin:0;font-size:14px;line-height:22px;color:var(--tx-body)\">{{ auth.sub }}<\u002Fp><\u002Fdiv>\n      <sc-if value=\"{{ auth.hasError }}\"><div role=\"alert\" style=\"padding:10px 14px 10px 13px;background:var(--danger-bg);border-left:3px solid var(--danger-mark);border-radius:0 4px 4px 0;font-size:14px;line-height:22px;color:var(--danger-fg)\">{{ auth.error }}<\u002Fdiv><\u002Fsc-if>\n      <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">{{ auth.emailLabel }}<\u002Fspan><input type=\"email\" value=\"{{ auth.email }}\" sc-camel-on-change=\"{{ auth.onEmail }}\" style=\"height:38px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-content);font-size:14px\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">Password<\u002Fspan><input type=\"password\" value=\"{{ auth.pass }}\" sc-camel-on-change=\"{{ auth.onPass }}\" style=\"height:38px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-content);font-size:14px\"><\u002Flabel>\n      <button type=\"submit\" style=\"height:38px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-size:14px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--accent-hover)\">{{ auth.cta }}<\u002Fbutton>\n      <span style=\"font-size:13px;color:var(--tx-2);display:flex;gap:6px\">{{ auth.switchText }}<button type=\"button\" sc-camel-on-click=\"{{ auth.switchMode }}\" style=\"padding:0;border:none;background:none;color:var(--accent-text);font-size:13px;font-weight:500;cursor:pointer\">{{ auth.switchCta }}<\u002Fbutton><\u002Fspan>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ signedIn }}\">\n  <!-- SIDEBAR -->\n  <aside style=\"width:228px;flex:none;height:100%;background:var(--bg-canvas);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:28px\">\n    <div style=\"display:flex;flex-direction:column;gap:2px;padding:4px 10px\">\n      <div style=\"display:flex;align-items:center;gap:8px\"><span role=\"img\" aria-label=\"Quoly\" style=\"width:18px;height:18px;flex:none;background:var(--logo, url(&quot;44829117-3c38-4aef-a119-32a0af6131c0&quot;)) center / contain no-repeat\"><\u002Fspan><span style=\"font-size:15px;line-height:20px;font-weight:600;letter-spacing:-0.01em\">Quoly<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:12px;line-height:16px;color:var(--tx-2);padding-left:26px\">Grupo Alvera<\u002Fspan>\n    <\u002Fdiv>\n    <nav aria-label=\"Main\" style=\"display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ nav }}\" as=\"it\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ it.go }}\" aria-current=\"{{ it.current }}\" style=\"{{ it.style }}\" style-hover=\"background:var(--bg-band)\"><span>{{ it.label }}<\u002Fspan><span style=\"{{ it.countStyle }}\">{{ it.count }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:2px\">\n      <button sc-camel-on-click=\"{{ goSettings }}\" style=\"{{ settingsNavStyle }}\" style-hover=\"background:var(--bg-band)\">Settings<\u002Fbutton>\n      <div style=\"display:flex;flex-direction:column;padding:10px 10px 4px;border-top:1px solid var(--line);margin-top:8px;gap:2px\">\n        <span style=\"font-size:13px;line-height:20px;font-weight:500\">Mariana Torres<\u002Fspan>\n        <span style=\"font-size:12px;line-height:16px;color:var(--tx-2)\">mariana.torres@grupoalvera.mx<\u002Fspan>\n        <button sc-camel-on-click=\"{{ signOut }}\" style=\"align-self:flex-start;margin-top:6px;padding:0;border:none;background:none;color:var(--tx-2);font-size:12px;font-weight:500;cursor:pointer\">Sign out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1;min-width:0;height:100%;overflow:auto;position:relative\">\n\n  <!-- REQUESTS -->\n  <sc-if value=\"{{ rList }}\">\n    <div style=\"padding:28px 40px 56px;display:flex;flex-direction:column;g ue=\"{{ f.qty }}\" sc-camel-on-change=\"{{ f.onQty }}\" aria-invalid=\"{{ f.errQty }}\" style=\"{{ f.qtyStyle }}\"><sc-if value=\"{{ f.errQty }}\"><span style=\"font-size:12px;color:var(--danger-fg)\">Enter the amount to quote now.<\u002Fspan><\u002Fsc-if><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">Unit of measure<\u002Fspan><sc-raw-select value=\"{{ f.unit }}\" sc-camel-on-change=\"{{ f.onUnit }}\" aria-invalid=\"{{ f.errUnit }}\" style=\"{{ f.unitStyle }}\"><option value=\"\">Choose unit<\u002Foption><sc-for list=\"{{ f.units }}\" as=\"u\"><option value=\"{{ u }}\">{{ u }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><sc-if value=\"{{ f.errUnit }}\"><span style=\"font-size:12px;color:var(--danger-fg)\">Choose how this product is bought.<\u002Fspan><\u002Fsc-if><\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">Internal reference <span style=\"font-weight:400;color:var(--tx-2)\">Optional<\u002Fspan><\u002Fspan><input value=\"{{ f.ref }}\" sc-camel-on-change=\"{{ f.onRef }}\" style=\"width:260px;height:36px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-surface);font-size:14px\"><\u002Flabel>\n            <button type=\"button\" role=\"switch\" aria-checked=\"{{ f.showRef }}\" sc-camel-on-click=\"{{ f.toggleShowRef }}\" style=\"display:flex;align-items:center;gap:10px;padding:0;border:none;background:none;cursor:pointer;text-align:left\"><span style=\"{{ f.switchStyle }}\"><span style=\"{{ f.knobStyle }}\"><\u002Fspan><\u002Fspan><span style=\"font-size:13px;color:var(--tx-body)\">Include in what suppliers receive<\u002Fspan><\u002Fbutton>\n            <span style=\"font-size:12px;color:var(--tx-2);padding-left:38px\">{{ f.refNote }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:220px minmax(0,580px);gap:48px;padding:24px 0;border-top:1px solid var(--line)\">\n        <div><h2 style=\"margin:0;font-size:16px;line-height:24px;font-weight:600\">Terms<\u002Fh2><p style=\"margin:4px 0 0;font-size:13px;line-height:20px;color:var(--tx-2)\">The place field is named for the Incoterm you choose.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div style=\"display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px\">\n            <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">Incoterm <span style=\"font-weight:400;color:var(--tx-2)\">Optional<\u002Fspan><\u002Fspan><sc-raw-select value=\"{{ f.inco }}\" sc-camel-on-change=\"{{ f.onInco }}\" style=\"height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-surface);font-size:14px\"><option value=\"\">No Incoterm<\u002Foption><optgroup label=\"Any mode of transport\"><sc-for list=\"{{ f.incoAny }}\" as=\"o\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for><\u002Foptgroup><optgroup label=\"Sea and inland waterway\"><sc-for list=\"{{ f.incoSea }}\" as=\"o\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for><\u002Foptgroup><\u002Fsc-raw-select><span style=\"font-size:12px;color:var(--tx-2)\">Incoterms 2020<\u002Fspan><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">{{ f.placeLabel }}<\u002Fspan><input value=\"{{ f.place }}\" sc-camel-on-change=\"{{ f.onPlace }}\" disabled=\"{{ f.placeDisabled }}\" placeholder=\"{{ f.placeHint }}\" style=\"height:36px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-surface);font-size:14px\"><span style=\"font-size:12px;color:var(--tx-2)\">A factory, warehouse, terminal, airport, port, city or distribution center.<\u002Fspan><\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">Requested delivery date <span style=\"font-weight:400;color:var(--tx-2)\">Optional<\u002Fspan><\u002Fspan><input type=\"date\" value=\"{{ f.date }}\" sc-camel-on-change=\"{{ f.onDate }}\" style=\"width:200px;height:36px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-surface);font-size:14px\"><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:220px minmax(0,580px);gap:48px;padding:24px 0;border-top:1px solid var(--line)\">\n        <div><h2 style=\"margin:0;font-size:16px;line-height:24px;font-weight:600\">Specification<\u002Fh2><p style=\"margin:4px 0 0;font-size:13px;line-height:20px;color:var(--tx-2)\">A file, written requirements, both, or neither.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">Technical requirements <span style=\"font-weight:400;color:var(--tx-2)\">Optional<\u002Fspan><\u002Fspan><textarea rows=\"5\" value=\"{{ f.reqs }}\" sc-camel-on-change=\"{{ f.onReqs }}\" placeholder=\"Grades, certificates, tolerances, packing. Anything the supplier should know.\" style=\"padding:10px 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-surface);font-size:14px;line-height:22px;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:12px;font-weight:500\">Reference specification <span style=\"font-weight:400;color:var(--tx-2)\">Optional<\u002Fspan><\u002Fspan>\n            <sc-if value=\"{{ f.hasFile }}\"><div style=\"display:flex;align-items:center;gap:12px;height:44px;padding:0 4px 0 12px;border:1px solid var(--line);border-radius:6px\"><span style=\"font-size:11px;font-weight:500;color:var(--tx-2);border:1px solid var(--line-strong);border-radius:4px;padding:0 4px\">PDF<\u002Fspan><span style=\"flex:1;font-size:14px\">{{ f.fileName }}<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ f.removeFile }}\" style=\"height:32px;padding:0 10px;border:none;background:none;color:var(--tx-2);font-size:13px;font-weight:500;cursor:pointer\">Remove<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ f.noFile }}\"><button type=\"button\" sc-camel-on-click=\"{{ f.attach }}\" style=\"align-self:flex-start;height:32px;padding:0 12px;border-radius:6px;border:1px dashed var(--line-strong);background:var(--bg-surface);font-size:13px;font-weight:500;cursor:pointer\">Attach file<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ f.showDatasheet }}\"><button type=\"button\" role=\"checkbox\" aria-checked=\"{{ f.askDatasheet }}\" sc-camel-on-click=\"{{ f.toggleDatasheet }}\" style=\"display:flex;align-items:flex-start;gap:10px;padding:0;border:none;background:none;cursor:pointer;text-align:left\"><span style=\"{{ f.dsBox }}\"><span style=\"{{ f.dsTick }}\"><\u002Fspan><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:14px;line-height:20px\">Ask suppliers for their current datasheet<\u002Fspan><span style=\"font-size:12px;color:var(--tx-2)\">Without a reference, Quoly shows what each supplier sends and does not score it.<\u002Fspan><\u002Fspan><\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;position:sticky;bottom:0;display:flex;gap:8px;padding:14px 0 18px 268px;border-top:1px solid var(--line);background:var(--bg-content)\">\n        <button sc-camel-on-click=\"{{ f.create }}\" style=\"height:36px;padding:0 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-size:14px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--accent-hover)\">Create request<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ f.saveDraft }}\" style=\"height:36px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--bg-band);font-size:14px;font-weight:500;cursor:pointer\">Save draft<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goList }}\" style=\"height:36px;padding:0 12px;border:none;background:none;color:var(--tx-2);font-size:14px;font-weight:500;cursor:pointer\">Cancel<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- RFQ DETAIL -->\n  <sc-if value=\"{{ rRfq }}\">\n    <div style=\"display:flex;flex-direction:column;min-height:100%\">\n      <header style=\"padding:22px 40px 0;display:flex;flex-direction:column;gap:6px\">\n        <nav style=\"font-size:13px;color:var(--tx-2);display:flex;gap:6px;align-items:center\"><button sc-camel-on-click=\"{{ goList }}\" style=\"padding:0;border:none;background:none;color:var(--accent-text);font-size:13px;cursor:pointer\">Requests<\u002Fbutton><span>/<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px\">{{ rf.id }}<\u002Fspan><\u002Fnav>\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <h1 style=\"margin:0;flex:1;font-size:26px;line-height:32px;font-weight:600;letter-spacing:-0.02em\">{{ rf.product }}<\u002Fh1>\n          <sc-if value=\"{{ rf.isOpen }}\"><button sc-camel-on-click=\"{{ rf.askClose }}\" style=\"height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg-band);font-size:13px;font-weight:500;cursor:pointer\">Close request<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ rf.isClosed }}\"><button sc-camel-on-click=\"{{ rf.reopen }}\" style=\"height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg-band);font-size:13px;font-weight:500;cursor:pointer\">Reopen<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;align-items:center;font-size:13px;color:var(--tx-2)\"><span style=\"{{ rf.statusPill }}\">{{ rf.statusLabel }}<\u002Fspan><sc-if value=\"{{ rf.hasAward }}\"><span style=\"{{ rf.awardPill }}\">{{ rf.awardText }}<\u002Fspan><\u002Fsc-if><span>{{ rf.meta }}<\u002Fspan><\u002Fdiv>\n        <div role=\"tablist\" style=\"display:flex;gap:24px;margin-top:10px;border-bottom:1px solid var(--line)\"><sc-for list=\"{{ rf.tabs }}\" as=\"t\" hint-placeholder-count=\"2\"><button role=\"tab\" aria-selected=\"{{ t.on }}\" sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">{{ t.label }}<span style=\"{{ t.countStyle }}\">{{ t.count }}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n      <\u002Fheader>\n\n      <sc-if value=\"{{ rf.isSupTab }}\">\n        <div style=\"display:flex;flex-wrap:wrap;flex:1;align-items:stretch\">\n          <div style=\"flex:1 1 620px;min-width:0;padding:18px 40px 48px;display:flex;flex-direction:column;gap:22px\">\n            <sc-if value=\"{{ rf.isClosed }}\"><div role=\"status\" style=\"padding:10px 14px 10px 13px;background:var(--bg-surface);border-left:3px solid var(--tx-3);border-radius:0 4px 4px 0;font-size:14px;line-height:22px;color:var(--tx-body)\"><span style=\"font-weight:600;color:var(--tx-1)\">This request is closed.<\u002Fspan> Everything stays readable. Nothing more is sent.<\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));row-gap:14px\"><sc-for list=\"{{ rf.facts }}\" as=\"f\"><div style=\"{{ f.box }}\"><span style=\"font-size:12px;line-height:16px;font-weight:500;color:var(--tx-2)\">{{ f.label }}<\u002Fspan><span style=\"{{ f.vStyle }}\">{{ f.value }}<\u002Fspan><span style=\"font-size:12px;line-height:16px;color:var(--tx-2)\">{{ f.sub }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n\n            <sc-if value=\"{{ rf.hasAsks }}\">\n              <section aria-label=\"Waiting on you\">\n                <div style=\"display:flex;align-items:baseline;gap:12px;padding-bottom:6px\"><h2 style=\"margin:0;font-size:16px;line-height:24px;font-weight:600\">Waiting on you<\u002Fh2><span style=\"{{ rf.asksLabelStyle }}\">{{ rf.asksLabel }}<\u002Fspan><span style=\"margin-left:auto;font-size:12px;color:var(--tx-2)\">Resolving an ask sends nothing.<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ rf.asks }}\" as=\"a\">\n                  <div style=\"display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line)\">\n                    <span style=\"height:20px;display:flex;align-items:center\"><span style=\"{{ a.marker }}\"><\u002Fspan><\u002Fspan>\n                    <div style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-size:12px;line-height:16px\"><span style=\"{{ a.kindStyle }}\">{{ a.kind }}<\u002Fspan> <span style=\"color:var(--tx-2)\">· {{ a.supplier }}<\u002Fspan><\u002Fspan><p style=\"{{ a.textStyle }}\">“{{ a.text }}”<\u002Fp><span style=\"font-size:13px;line-height:20px;color:var(--tx-2)\">{{ a.answerLine }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;gap:6px;align-items:flex-start\"><button sc-camel-on-click=\"{{ a.openReply }}\" style=\"height:28px;padding:0 8px;border:none;background:none;color:var(--accent-text);font-size:13px;font-weight:500;cursor:pointer\">Open reply<\u002Fbutton><sc-if value=\"{{ a.isOpen }}\"><button sc-camel-on-click=\"{{ a.resolve }}\" style=\"height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg-band);font-size:13px;font-weight:500;cursor:pointer\">Mark resolved<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsection>\n            <\u002Fsc-if>\n\n            <section aria-label=\"Suppliers\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding-bottom:10px\">\n                <h2 style=\"margin:0;font-size:16px;line-height:24px;font-weight:600\">Suppliers<\u002Fh2>\n                <span style=\"flex:1;font-size:12px;color:var(--tx-2)\">{{ rf.mailNote }}<\u002Fspan>\n                <sc-if value=\"{{ rf.isOpen }}\">\n                  <div style=\"position:relative\">\n                    <button sc-camel-on-click=\"{{ rf.toggleAdd }}\" aria-expanded=\"{{ rf.addOpen }}\" style=\"height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg-band);font-size:13px;font-weight:500;cursor:pointer\">Add supplier<\u002Fbutton>\n                    <sc-if value=\"{{ rf.addOpen }}\">\n                      <div role=\"dialog\" aria-label=\"Add supplier\" style=\"position:absolute;right:0;top:38px;width:400px;z-index:5;background:var(--bg-content);border:1px solid var(--line);border-radius:8px;box-shadow:var(--overlay-shadow)\">\n                        <div role=\"tablist\" style=\"display:flex;gap:20px;padding:0 14px;border-bottom:1px solid var(--line)\"><sc-for list=\"{{ rf.addTabs }}\" as=\"t\"><button role=\"tab\" aria-selected=\"{{ t.on }}\" sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                        <sc-if value=\"{{ rf.addDir }}\">\n                          <div style=\"padding:10px 14px 6px\"><input autofocus=\"\" placeholder=\"Search your directory\" value=\"{{ rf.addQ }}\" sc-camel-on-change=\"{{ rf.onAddQ }}\" style=\"width:100%;height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-surface);font-size:13px\"><\u002Fdiv>\n                          <div style=\"max-height:280px;overflow:auto\"><sc-for list=\"{{ rf.addList }}\" as=\"d\"><button sc-camel-on-click=\"{{ d.add }}\" style=\"display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:6px 14px;border:none;background:transparent;cursor:pointer;text-align:left\" style-hover=\"background:var(--bg-surface)\"><span style=\"display:flex;flex-direction:column;gap:2px;flex:1\"><span style=\"font-size:13px;font-weight:500\">{{ d.name }}<\u002Fspan><span style=\"font-size:12px;color:var(--tx-2)\">{{ d.meta }}<\u002Fspan><\u002Fspan><span style=\"font-size:12px;font-weight:500;color:var(--accent-text)\">Add<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                          <sc-if value=\"{{ rf.addEmpty }}\"><span style=\"display:block;padding:10px 14px;font-size:13px;color:var(--tx-2)\">No other suppliers match.<\u002Fspan><\u002Fsc-if>\n                          <span style=\"display:block;padding:8px 14px 12px;font-size:12px;color:var(--tx-2);border-top:1px solid var(--line)\">Archived suppliers don't appear here.<\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ rf.addOne }}\">\n                          <div style=\"padding:14px;display:flex;flex-direction:column;gap:12px\">\n                            <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">Company<\u002Fspan><input value=\"{{ rf.oneName }}\" sc-camel-on-change=\"{{ rf.onOneName }}\" style=\"height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-surface);font-size:13px\"><\u002Flabel>\n                            <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:500\">Contact email<\u002Fspan><input value=\"{{ rf.oneEmail }}\" sc-camel-on-change=\"{{ rf.onOneEmail }}\" style=\"height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-surface);font-size:13px\"><\u002Flabel>\n                            <span style=\"font-size:12px;color:var(--tx-2)\">Only on this request. It is not added to your directory.<\u002Fspan>\n                            <button sc-camel-on-click=\"{{ rf.addOneOff }}\" style=\"align-self:flex-start;height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-size:13px;font-weight:500;cursor:pointer\">Add to request<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ rf.hasSend }}\"><button sc-camel-on-click=\"{{ rf.send }}\" style=\"height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--accent-hover)\">{{ rf.sendLabel }}<\u002Fbutton><\u002Fsc-if>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ rf.copied }}\"><div role=\"status\" style=\"margin-bottom:10px;padding:10px 14px 10px 13px;background:var(--selected);border-left:3px solid var(--accent-line);border-radius:0 4px 4px 0;display:flex;align-items:center;gap:16px\"><p style=\"margin:0;flex:1;font-size:14px;line-height:22px;color:var(--accent-text)\"><span style=\"font-weight:600\">Request copied.<\u002Fspan> Paste it into an email from your own mailbox. Suppliers stay “Not contacted” until you confirm.<\u002Fp><button sc-camel-on-click=\"{{ rf.markSent }}\" style=\"height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg-content);font-size:13px;font-weight:500;cursor:pointer\">I've sent it<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n              <div role=\"table\" aria-label=\"Suppliers on this request\">\n                <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(0,1.3fr) 180px minmax(0,1fr) 150px;gap:16px;align-items:center;height:32px;padding:0 12px;background:var(--bg-band);border-radius:4px;font-size:12px;font-weight:500;color:var(--tx-2)\"><span>Supplier<\u002Fspan><span>Stage<\u002Fspan><span>Latest<\u002Fspan><span style=\"text-align:right\">Price as quoted<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ rf.sups }}\" as=\"s\" hint-placeholder-count=\"5\">\n                  <div style=\"{{ s.wrap }}\">\n                    <div role=\"row\" sc-camel-on-click=\"{{ s.toggle }}\" aria-expanded=\"{{ s.expanded }}\" style=\"display:grid;grid-template-columns:minmax(0,1.3fr) 180px minmax(0,1fr) 150px;gap:16px;align-items:center;min-height:54px;padding:8px 12px;cursor:pointer\">\n                      <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">{{ s.name }}<\u002Fspan><span style=\"font-size:12px;color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ s.contact }}<\u002Fspan><\u002Fdiv>\n                      <span><span style=\"{{ s.pill }}\">{{ s.stage }}<\u002Fspan><\u002Fspan>\n                      <span style=\"font-size:13px;color:var(--tx-body)\">{{ s.latest }} <span style=\"color:var(--tx-2)\">{{ s.date }}<\u002Fspan><\u002Fspan>\n                      <span style=\"{{ s.priceStyle }}\">{{ s.price }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ s.expanded }}\">\n                      <div style=\"padding:0 12px 14px 12px;display:flex;flex-direction:column\">\n                        <sc-for list=\"{{ s.thread }}\" as=\"m\"><div style=\"display:grid;grid-template-columns:80px 90px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:20px\"><span style=\"color:var(--tx-2)\">{{ m.when }}<\u002Fspan><span style=\"font-weight:500\">{{ m.dir }}<\u002Fspan><span style=\"color:var(--tx-body)\">{{ m.what }}<\u002Fspan><sc-if value=\"{{ m.canOpen }}\"><button sc-camel-on-click=\"{{ m.open }}\" style=\"padding:0;border:none;background:none;color:var(--accent-text);font-size:13px;font-weight:500;cursor:pointer\">Open reply<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fsc-for>\n                        <div style=\"display:flex;gap:16px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;align-items:center\">\n                          <sc-if value=\"{{ s.hasQuote }}\"><button sc-camel-on-click=\"{{ s.openQuote }}\" style=\"padding:0;border:none;background:none;color:var(--accent-text);font-size:13px;font-weight:500;cursor:pointer\">Quotation<\u002Fbutton><\u002Fsc-if>\n                          <sc-if value=\"{{ s.hasSpec }}\"><button sc-camel-on-click=\"{{ s.openSpec }}\" style=\"padding:0;border:none;background:none;color:var(--accent-text);font-size:13px;font-weight:500;cursor:pointer\">Specification evidence<\u002Fbutton><\u002Fsc-if>\n                          <sc-if value=\"{{ s.canClose }}\"><button sc-camel-on-click=\"{{ s.askClose }}\" style=\"margin-left:auto;padding:0;border:none;background:none;color:var(--tx-2);font-size:13px;font-weight:500;cursor:pointer\">Close supplier on this request<\u002Fbutton><\u002Fsc-if>\n                          <sc-if value=\"{{ s.canRemove }}\"><button sc-camel-on-click=\"{{ s.remove }}\" style=\"margin-left:auto;padding:0;border:none;background:none;color:var(--tx-2);font-size:13px;font-weight:500;cursor:pointer\">Remove from request<\u002Fbutton><\u002Fsc-if>\n                        <\u002Fdiv>\n                        <sc-if value=\"{{ s.confirming }}\"><div style=\"margin-top:10px;padding:12px 14px;background:var(--bg-surface);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:12px\"><p style=\"margin:0;flex:1;font-size:13px;line-height:20px;color:var(--tx-body)\"><span style=\"font-weight:600;color:var(--tx-1)\">Close {{ s.name }} on this request?<\u002Fspan> Its messages stay on file. The request stays open and nothing is sent.<\u002Fp><button sc-camel-on-click=\"{{ s.confirmClose }}\" style=\"height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line-strong);background:var(--bg-content);font-size:13px;font-weight:500;cursor:pointer\">Close supplier<\u002Fbutton><button sc-camel-on-click=\"{{ s.cancelClose }}\" style=\"height:28px;padding:0 8px;border:none;background:none;color:var(--tx-2);font-size:13px;font-weight:500;cursor:pointer\">Cancel<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ rf.noSups }}\"><div style=\"padding:28px 12px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:14px\">No suppliers on this request yet.<\u002Fspan><span style=\"font-size:13px;color:var(--tx-2)\">Add suppliers from your directory, or one for this request only.<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <aside aria-label=\"The request\" style=\"flex:1 1 300px;max-width:420px;background:var(--bg-surface);border-left:1px solid var(--line);padding:20px 26px\">\n            <h2 style=\"margin:0 0 10px;font-size:15px;line-height:22px;font-weight:600\">The request<\u002Fh2>\n            <dl style=\"margin:0;display:flex;flex-direction:column\">\n              <sc-for list=\"{{ rf.sheet }}\" as=\"d\"><div style=\"padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px\"><dt style=\"font-size:12px;font-weight:500;color:var(--tx-2)\">{{ d.l }}<\u002Fdt><dd style=\"{{ d.style }}\">{{ d.v }}<\u002Fdd><sc-if value=\"{{ d.hasNote }}\"><span style=\"font-size:12px;color:var(--tx-2)\">{{ d.note }}<\u002Fspan><\u002Fsc-if><\u002Fdiv><\u002Fsc-for>\n              <div style=\"padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px\"><dt style=\"font-size:12px;font-weight:500;color:var(--tx-2)\">Technical requirements<\u002Fdt>\n                <sc-if value=\"{{ rf.hasReqs }}\"><dd style=\"margin:0;display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:8px;row-gap:2px;font-size:13px;line-height:20px;color:var(--tx-body)\"><sc-for list=\"{{ rf.reqs }}\" as=\"q\"><span style=\"color:var(--tx-3);text-align:right\">{{ q.n }}<\u002Fspan><span>{{ q.t }}<\u002Fspan><\u002Fsc-for><\u002Fdd><\u002Fsc-if>\n                <sc-if value=\"{{ rf.noReqs }}\"><dd style=\"margin:0;font-size:13px;color:var(--tx-3)\">None written<\u002Fdd><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdl>\n          <\u002Faside>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ rf.isCmpTab }}\">\n        <div style=\"padding:16px 40px 56px;display:flex;flex-direction:column\">\n          <div aria-label=\"Summary\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));row-gap:14px\"><sc-for list=\"{{ cm.facts }}\" as=\"f\" hint-placeholder-count=\"5\"><div style=\"{{ f.box }}\"><span style=\"font-size:12px;line-height:16px;font-weight:500;color:var(--tx-2)\">{{ f.label }}<\u002Fspan><span style=\"{{ f.vStyle }}\">{{ f.value }}<\u002Fspan><span style=\"font-size:12px;line-height:16px;color:var(--tx-2)\">{{ f.sub }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <sc-if value=\"{{ cm.hasRec }}\">\n            <section aria-label=\"Recommendation\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:24px 40px;padding:20px 0 8px;margin-top:18px;border-top:1px solid var(--line)\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"{{ cm.recPill }}\">Recommended<\u002Fspan><span style=\"font-size:12px;color:var(--tx-2)\">AI summary · {{ cm.recBasis }}<\u002Fspan><\u002Fdiv>\n                <h2 style=\"margin:0;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-0.01em\">{{ cm.recName }}<\u002Fh2>\n                <span style=\"font-size:13px;line-height:20px;color:var(--tx-body)\">{{ cm.recWhy }}<\u002Fspan>\n                <ul style=\"margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:20px;color:var(--tx-body)\"><sc-for list=\"{{ cm.summary }}\" as=\"x\"><li>{{ x }}<\u002Fli><\u002Fsc-for><\u002Ful>\n                <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px\">\n                  <sc-if value=\"{{ cm.notAwarded }}\"><button sc-camel-on-click=\"{{ cm.awardRec }}\" style=\"height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:var(--accent-hover)\">Record award to {{ cm.recShort }}<\u002Fbutton><\u002Fsc-if>\n                  <sc-if value=\"{{ cm.awarded }}\"><span style=\"{{ cm.awardPill }}\">Awarded to {{ cm.awardName }} · {{ cm.awardDate }}<\u002Fspan><button sc-camel-on-click=\"{{ cm.clearAward }}\" style=\"padding:0;border:none;background:none;color:var(--accent-text);font-size:13px;font-weight:500;cursor:pointer\">Change award<\u002Fbutton><\u002Fsc-if>\n                <\u002Fdiv>\n                <span style=\"font-size:12px;line-height:16px;color:var(--tx-2)\">Quoly recommends; you decide. The award is recorded only when you confirm it, and suppliers are not notified.<\u002Fspan>\n              <\u002Fdiv>\n              <div role=\"table\" aria-label=\"Ranking\">\n                <div role=\"row\" style=\"display:grid;grid-template-columns:28px minmax(0,1fr) 120px 90px 90px 110px;gap:12px;align-items:center;height:32px;padding:0 10px;background:var(--bg-band);border-radius:4px;font-size:12px;font-weight:500;color:var(--tx-2)\"><span>#<\u002Fspan><span>Supplier<\u002Fspan><span style=\"text-align:right\">Normalized<\u002Fspan><span>Terms<\u002Fspan><span>Open asks<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ cm.ranking }}\" as=\"k\"><div role=\"row\" style=\"{{ k.style }}\"><span style=\"font-size:13px;font-weight:600;color:var(--tx-2)\">{{ k.rank }}<\u002Fspan><span style=\"display:flex;flex-dir

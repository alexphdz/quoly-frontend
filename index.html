<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quoly-mark.svg" />
    <link rel="icon" type="image/png" href="/quoly.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/quoly.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F0F1F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0E12" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Quoly" />
    <meta name="apple-mobile-web-app-title" content="Quoly" />

    <!-- Primary metadata (per-route pages override title/description/robots at runtime) -->
    <title>Quoly</title>
    <meta name="description" content="Quoly is the workspace between asking suppliers and deciding. Turn supplier emails and quote files into structured, reviewable data so you can compare quotes and record a decision." />
    <link rel="canonical" href="https://quoly.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quoly" />
    <meta property="og:title" content="Quoly — The workspace between asking suppliers and deciding" />
    <meta property="og:description" content="Turn supplier emails and quote files into structured, reviewable data so you can compare quotes and record a decision." />
    <meta property="og:url" content="https://quoly.app/" />
    <meta property="og:image" content="https://quoly.app/quoly.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quoly — The workspace between asking suppliers and deciding" />
    <meta name="twitter:description" content="Turn supplier emails and quote files into structured, reviewable data so you can compare quotes and record a decision." />
    <meta name="twitter:image" content="https://quoly.app/quoly.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
